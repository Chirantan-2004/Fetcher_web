services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./storage:/app/storage"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
